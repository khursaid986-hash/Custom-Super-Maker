
name: A04s Stock Firmware and GSI

on:
  workflow_dispatch:
    inputs:
      gsi_url:
        description: "Direct download URL of the DerpFest GSI .img.xz"
        required: true
        type: string
      stock_firmware_url:
        description: "MEGA share URL of Samsung stock firmware"
        required: true
        type: string

jobs:
  download-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils coreutils megatools file

      - name: Prepare folders
        run: |
          mkdir -p output stock
          df -h

      - name: Download DerpFest GSI
        env:
          GSI_URL: ${{ inputs.gsi_url }}
        run: |
          set -e
          case "$GSI_URL" in
            https://*) ;;
            *) echo "ERROR: GSI URL must start with https://"; exit 1 ;;
          esac
          curl -fL --retry 3 --retry-delay 5 \
            "$GSI_URL" -o output/derpfest.img.xz
          echo "GSI download complete"
          ls -lh output/derpfest.img.xz
          file output/derpfest.img.xz
          xz -t output/derpfest.img.xz
          sha256sum output/derpfest.img.xz \
            | tee output/derpfest.sha256

      - name: Download Samsung stock firmware from MEGA
        env:
          STOCK_URL: ${{ inputs.stock_firmware_url }}
        run: |
          set -e
          case "$STOCK_URL" in
            https://mega.nz/*|https://mega.co.nz/*) ;;
            *) echo "ERROR: Provide a valid MEGA share URL"; exit 1 ;;
          esac
          megadl "$STOCK_URL" --path stock
          echo "MEGA download complete"
          find stock -maxdepth 2 -type f -printf '%p %s bytes\n'
          test "$(find stock -type f | wc -l)" -gt 0
          find stock -type f -print0 \
            | xargs -0 sha256sum \
            | tee output/stock-firmware.sha256

      - name: Check available space
        if: always()
        run: |
          df -h
          du -sh output stock 2>/dev/null || true

      - name: Upload downloaded files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A04s-Stock-and-DerpFest
          path: |
            output/
            stock/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
